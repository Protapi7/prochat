services:
  # 24/7 Cloud Web Service running both Fullstack Frontend & WebSocket Backend
  - type: web
    name: prochat
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Optional Cloud PostgreSQL (e.g. Neon.tech / Supabase / Render). 
      # If left empty, ProChat automatically uses SQLite with zero configuration!
      - key: DATABASE_URL
        sync: false
