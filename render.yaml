services:
  # 24/7 Cloud Web Service running both Fullstack Frontend & WebSocket Backend
  - type: web
    name: prochat
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
